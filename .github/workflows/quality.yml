name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run python scripts/check_source_limits.py
      - run: uv run python scripts/export_contracts.py
      - run: uv run python scripts/export_artifact_schemas.py
      - run: git diff --exit-code -- contracts/
      - run: uv run python scripts/submission_check.py --allow-placeholders
